<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>後台登入</title>
    <link
      rel="stylesheet"
      th:href="@{/webjars/bootstrap/4.2.1/css/bootstrap.min.css}"
    />
    <style>
      body {
        min-height: 100vh;
        background-color: #f1f3f5;
      }
      .login-card {
        width: 100%;
        max-width: 380px;
      }
    </style>
  </head>
  <body class="d-flex align-items-center justify-content-center">
    <div class="card shadow-sm login-card mx-3">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-1">BistrOps 後台</h4>
        <p class="text-center text-muted small mb-4">員工登入</p>

        <!-- <div class="alert alert-danger py-2" th:if="${errorMsg}" th:text="${errorMsg}"></div> -->
        <div class="alert alert-danger py-2" th:if="${param.error}">
          員工編號或密碼錯誤，或帳號已停用
        </div>
        <div class="alert alert-success py-2" th:if="${param.logout}">
          已登出
        </div>

        <form th:action="@{/admin/login}" method="post">
          <div class="form-group">
            <label for="empNo">員工編號</label>
            <input
              type="number"
              class="form-control"
              id="empNo"
              name="empNo"
              min="1"
              th:value="${empNo}"
              required
              autofocus
            />
          </div>
          <div class="form-group">
            <label for="empPassword">密碼</label>
            <input
              type="password"
              class="form-control"
              id="empPassword"
              name="empPassword"
              maxlength="16"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary btn-block mt-4">
            登入
          </button>
        </form>
      </div>
      <div class="card-footer text-center bg-white">
        <a class="small" th:href="@{/}">回前台首頁</a>
      </div>
    </div>
  </body>
</html>
