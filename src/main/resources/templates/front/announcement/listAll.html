<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops｜最新消息</title>
  <link rel="icon" th:href="@{/common/images/logo-mark.svg}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap">
  <!-- style.css：首頁的配色、header、footer；announcement.css：公告頁自己的版面 -->
  <link rel="stylesheet" th:href="@{/front/css/style.css}" />
  <link rel="stylesheet" th:href="@{/front/member/css/member.css}" />
  <link rel="stylesheet" th:href="@{/front/announcement/css/announcement.css}" />
  <!-- 不載入 main.js：它會抓首頁才有的輪播、FAQ 等元素，在這頁會出錯；版型需要的功能寫在 announcement.js -->
  <script th:src="@{/front/member/js/member.js}" defer></script>
  <script th:src="@{/front/announcement/js/announcement.js}" defer></script>
</head>

<body>
  <div th:replace="~{front/member/member_modals :: modals}"></div>

  <!-- ========== Header（與首頁相同，連結改成可以從其他頁跳回首頁的區塊） ========== -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a th:href="@{/bistroops}" class="logo">
        <img th:src="@{/common/images/logo-dark.svg}" alt="bistroops">
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="開啟選單" aria-expanded="false"><span></span></button>

      <nav class="nav" id="mainNav">
        <ul class="nav-list">
          <li><a th:href="@{/announcement}" class="active" aria-current="page">最新消息</a></li>
          <li><a href="#">預約訂位</a></li>
          <li><a href="#">候位狀況</a></li>
          <li><a th:href="@{/bistroops#menu}">瀏覽菜單</a></li>
          <li><a th:href="@{/bistroops#about}">關於我們</a></li>
          <li><a th:href="@{/bistroops#faq}">常見問題</a></li>
        </ul>
        <button type="button" class="btn-login" data-open-auth>登入 / 註冊</button>
        <div class="member-menu">
          <button type="button" class="member-menu-toggle">
            <span class="member-avatar" aria-hidden="true">
              <img th:src="@{/front/images/member.png}" alt="會員頭像">
            </span>
            會員中心
          </button>
          <div class="member-dropdown">
            <button type="button" data-member-tab="profile">個人資料</button>
            <button type="button" data-member-tab="orders">歷史訂單</button>
            <button type="button" data-member-tab="reservations">預約紀錄</button>
            <button type="button" data-logout>登出</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <!-- ========== 公告列表 ==========
       annList：FrontAnnouncementController 放入，只有「已開始」的公告，新的在前 -->
  <main class="ann-page section">
    <div class="container">
      <p class="eyebrow">News</p>
      <h1 class="section-title">最新消息</h1>

      <ul class="ann-grid" th:unless="${#lists.isEmpty(annList)}">
        <li th:each="ann : ${annList}">
          <a class="ann-card" th:href="@{/announcement/{no}(no=${ann.annNo})}">
            <div class="ann-thumb">
              <!-- 有圖片才輸出 img；沒有圖片顯示 logo 佔位 -->
              <img th:if="${ann.annImg != null}" loading="lazy"
                th:src="@{/announcement/image/{no}(no=${ann.annNo})}" th:alt="${ann.annTitle}">
              <div class="ann-thumb-empty" th:if="${ann.annImg == null}">
                <img th:src="@{/common/images/logo-mark.svg}" alt="">
              </div>
            </div>
            <div class="ann-card-body">
              <time class="ann-date" th:datetime="${ann.annBegin}"
                th:text="${#temporals.format(ann.annBegin, 'yyyy.MM.dd')}">2026.01.01</time>
              <h2 class="ann-title" th:text="${ann.annTitle}">公告標題</h2>
              <p class="ann-summary"
                th:text="${ann.annText != null ? #strings.abbreviate(ann.annText, 70) : ''}">公告摘要</p>
              <span class="ann-more">閱讀更多 <span aria-hidden="true">→</span></span>
            </div>
          </a>
        </li>
      </ul>

      <!-- 沒有任何公告時 -->
      <div class="ann-empty" th:if="${#lists.isEmpty(annList)}">
        <p>目前沒有最新消息，敬請期待。</p>
        <a class="btn-outline" th:href="@{/bistroops}">回首頁</a>
      </div>
    </div>
  </main>

  <!-- ========== Footer（與首頁相同） ========== -->
  <footer class="site-footer">
    <div class="footer-grid">
      <div>
        <h4>一起面對有限公司</h4>
      </div>

      <div>
        <h4>Navigation</h4>
        <ul class="footer-links">
          <li><a th:href="@{/announcement}">最新消息</a></li>
          <li><a th:href="@{/bistroops#menu}">瀏覽菜單</a></li>
          <li><a href="#">預約訂位</a></li>
          <li><a th:href="@{/bistroops#about}">關於我們</a></li>
          <li><a href="#">候位狀況</a></li>
          <li><a th:href="@{/bistroops#faq}">常見問題</a></li>
        </ul>
      </div>

      <div class="footer-contact">
        <h4>Contact</h4>
        <p>組別：TKA102G1</p>
        <p>成員：</p>
      </div>

      <div>
        <h4>Follow Us</h4>
      </div>
    </div>
    <p class="copyright">© <span id="year"></span> Bistroops. All rights reserved.</p>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="回到頂端">↑</button>
</body>

</html>
