<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops 後台｜權限不足</title>
  <link rel="icon" th:href="@{/common/images/logo-mark.svg}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <link rel="stylesheet" th:href="@{/staff/css/staff.css}" />
  <link rel="stylesheet" th:href="@{/staff/css/403.css}" />
  <!-- staff.js：左邊選單「尚未開放」的提示、右上角時鐘 -->
  <script th:src="@{/staff/js/staff.js}" defer></script>
</head>

<!-- 已登入但權限不足時，StaffSecurityConfig 的 accessDeniedPage("/staff/403") 會轉到這頁 -->
<body class="staff-layout">
  <!-- 左邊選單（共用）；這頁不屬於任何選單項目，所以傳空字串 -->
  <nav th:replace="~{staff/staff_sidebar :: sidebar('')}"></nav>

  <main class="staff-main">
    <header class="staff-header">
      <div>
        <p class="staff-eyebrow">Bistroops Staff</p>
      </div>
      <p class="staff-clock" id="staffClock"></p>
    </header>

    <section class="staff-card denied-card">
      <span class="denied-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
      </span>
      <p class="denied-code">403</p>
      <h1 class="denied-title">權限不足</h1>
      <p class="denied-desc">您的帳號沒有使用這個功能的權限，<br>如有需要請洽主管開通。</p>

      <div class="denied-actions">
        <a class="staff-btn btn-pay" th:href="@{/staff}">回主頁</a>
        <!-- 登出必須用 POST（StaffSecurityConfig 的 logoutUrl），th:action 會自動加上 _csrf -->
        <form th:action="@{/staff/logout}" method="post">
          <button type="submit" class="staff-btn">登出，換帳號登入</button>
        </form>
      </div>
    </section>
  </main>

  <div class="staff-toast" id="staffToast" role="status" aria-live="polite"></div>
</body>

</html>
