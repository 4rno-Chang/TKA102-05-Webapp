# Docker 專用設定（Dockerfile 設定 SPRING_PROFILES_ACTIVE=docker 才會讀這份）
# 本機 Eclipse 執行時不會用到，還是讀自己的 application.properties（不在 git、也不會包進 image）
# 這裡不寫任何密碼：連線資訊都從環境變數來（docker-compose.yml 從 .env 傳進來），冒號後面是預設值
welcome.message=Bistroops

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/project?serverTimezone=Asia/Taipei
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Redis：登入的 Session（kyle 的 RedisSessionConfig）和候位都存在這裡
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379

spring.thymeleaf.cache=true
bistroops.admin.security-enabled=false

# 綠界刷卡（li 的 EcpayUtil / OrdersController）：值都從 .env 來，這裡不寫任何商店資料或金鑰
ecpay.merchant-id=${ECPAY_MERCHANT_ID}
ecpay.hash-key=${ECPAY_HASH_KEY}
ecpay.hash-iv=${ECPAY_HASH_IV}
ecpay.pay-url=${ECPAY_PAY_URL}
# 綠界付款完成後回呼的網址：要填 VM 對外可連到的網址，不能是 localhost
ecpay.return-url=${ECPAY_RETURN_URL}

# 候位 QR Code 掃描後開啟的網址（CJ 的 WaitingController）：同樣要填 VM 對外網址
app.waiting.join-url=${WAITING_JOIN_URL}

# \u4E0A\u50B3\u5716\u7247\u5927\u5C0F\uFF08application.properties \u4E0D\u6703\u5305\u9032 image\uFF0C\u8981\u5BEB\u5728\u9019\u88E1\uFF09
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# \u8D85\u904E\u4E0A\u9650\u6642\u8B93 Tomcat \u8B80\u5B8C\u518D\u56DE 413 \u932F\u8AA4\u9801\uFF0C\u4E0D\u8981\u76F4\u63A5\u65B7\u7DDA\uFF08\u9810\u8A2D 2MB\uFF09
server.tomcat.max-swallow-size=10MB